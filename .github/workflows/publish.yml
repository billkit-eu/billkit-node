name: Publish to npm

# Triggered by pushing a tag of the form ``vX.Y.Z``.
# The tag's version must match ``version`` in ``package.json``.
#
# Provenance requires this repository to be public; that is the whole reason
# the package is published from here rather than from the platform monorepo.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build + publish @billkit-eu/sdk
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm ci
      - name: Verify tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match package.json ($PKG_VERSION)."
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
