name: CI

# Unit tests only. The integration suite is gated on
# BILLKIT_INTEGRATION_BASE_URL and skips itself here: it needs a live BillKit
# API, which is exercised in the private platform repo before a release is cut.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # publint and arethetypeswrong: the exports map resolves for ESM,
      # CommonJS and every TypeScript moduleResolution a consumer can use.
      - name: Package checks
        run: npm run check:package
